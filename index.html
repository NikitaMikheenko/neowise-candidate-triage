<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div aria-live="polite" aria-atomic="true">
    <p id="status"></p>
    <section id="result" hidden>
      <h2>Тема</h2>
      <p id="topic"></p>
      <h2>Черновик ответа</h2>
      <pre id="draft"></pre>
    </section>
  </div>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topicLabels = new Map([
      ["delivery", "Доставка"],
      ["pricing", "Цена"],
      ["other", "Другое"],
    ]);
    const invalidInputMessage = "Введите текст заявки.";
    const manualReviewMessage = "Не удалось разобрать заявку автоматически. Разберите её вручную.";
    let latestRequest = 0;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++latestRequest;
      result.hidden = true;
      topic.textContent = "";
      draft.textContent = "";

      const text = message.value.trim();
      if (!text) {
        status.textContent = invalidInputMessage;
        return;
      }
      status.textContent = "Разбираем заявку…";

      let responseStatus;
      let payload;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        payload = await reply.json();
        responseStatus = reply.status;
      } catch {
        // Network errors and unreadable replies fall through to manual review.
      }

      if (requestId !== latestRequest) return;

      if (responseStatus === 400 && payload?.status === "invalid_input") {
        status.textContent = invalidInputMessage;
        return;
      }

      const topicLabel = topicLabels.get(payload?.topic);
      if (responseStatus === 200 && payload?.status === "ready" && topicLabel &&
          typeof payload.draft === "string" && payload.draft.trim()) {
        topic.textContent = topicLabel;
        draft.textContent = payload.draft;
        status.textContent = "";
        result.hidden = false;
        return;
      }

      status.textContent = manualReviewMessage;
    });
  </script>
</body>
</html>
